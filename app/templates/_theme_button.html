{# The light/dark button in the navigation bar. site.js makes it work.
   app.css shows the sun in dark mode (click for light) and the moon in light mode. #}
<button type="button" class="nav-link" data-theme-toggle title="Switch between light and dark mode"
        aria-label="Switch between light and dark mode">
  <i class="bi bi-sun theme-icon-sun"></i>
  <i class="bi bi-moon-stars theme-icon-moon"></i>
</button>
