{% extends "base.html" %}
{% block title %}Log in · Stock Trading System{% endblock %}
{% block content %}
  <div class="row justify-content-center align-items-center flex-grow-1 login-page">
    <div class="col-sm-9 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 text-center mb-4">Login</h1>
          {% if error %}
            <div class="alert alert-danger" role="alert" data-login-error>{{ error }}</div>
          {% endif %}
          <form method="post" action="{{ url_for('auth.signin') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" id="email" name="email" value="{{ email }}" autocomplete="username"
                     placeholder="Email" maxlength="320" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" autocomplete="current-password"
                     placeholder="Password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="stay_signed_in" name="stay_signed_in" value="y">
              <label class="form-check-label" for="stay_signed_in">Stay signed in</label>
            </div>
            <p class="text-body-secondary small text-center mb-4" data-first-login-note>New users will need to reset password upon first login.</p>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
